name: Imagen ONOS (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/onos-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nohafeynman/tel354-onos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:2026-2
            ${{ env.IMAGE }}:latest
