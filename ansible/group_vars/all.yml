# ---------------------------------------------------------------------------
# INTENCIÓN: qué pares de hosts deben poder comunicarse.
# Es la misma fuente de verdad para los dos playbooks:
#   - ovs_direct.yml la traduce a reglas en cada OVS (sin controlador)
#   - onos_intents.yml la traduce a HostToHostIntents en ONOS
# ---------------------------------------------------------------------------
connectivity:
  - [h1, h3]

# Hosts de la red de datos y switch de acceso de cada uno
lab_hosts:
  h1: {ip: 10.0.0.1, switch: sw2}
  h2: {ip: 10.0.0.2, switch: sw2}
  h3: {ip: 10.0.0.3, switch: sw3}
  h4: {ip: 10.0.0.4, switch: sw3}

# Switch de núcleo: une los dos switches de acceso
core_switch: sw1

# Controlador (red OOB)
controller: tcp:192.168.0.10:6653

# API REST de ONOS (los playbooks se ejecutan desde el controller)
onos_url: http://127.0.0.1:8181
onos_user: onos
onos_password: rocks
onos_app: edu.pucp.tel354.lab5
